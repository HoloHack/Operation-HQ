<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operation HQ browser tools</title><link rel="stylesheet" href="css/popup.css"></head><body><header><span class="mark">HQ</span><div><h1>Operation HQ</h1><p>Browser companion</p></div></header><p class="intro">Your dashboard lives in one workspace. Ordinary new tabs stay lightweight.</p><button id="open-dashboard" class="primary">Open dashboard ↗</button><div class="tools"><button data-tool="bookmarks">Bookmarks</button><button data-tool="tabs">Tabs & groups</button><button data-tool="gmail">Gmail</button><button data-tool="nexus">Commands</button><button data-tool="calendar">Calendar & timetable</button><button data-tool="notes">Notes</button><button data-tool="study">Study & assessments</button><button data-tool="gleam">Gleam</button></div><section><label><input id="bridge-enabled" type="checkbox">Allow dashboard access</label><p>Allows the Operation HQ dashboard to read a planning preview and open tools when you click. No automatic sync or changes to browser data. Enable only in your own browser profile.</p></section><p id="popup-status" role="status" aria-live="polite"></p><script src="js/dashboard-bridge.js"></script><script src="js/popup.js"></script></body></html>
