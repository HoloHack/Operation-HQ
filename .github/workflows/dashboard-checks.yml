name: Dashboard regression checks
on:
  pull_request:
    paths: ['dashboard/**', 'extension/js/dashboard-bridge.js', 'extension/manifest.json', '.github/workflows/dashboard-checks.yml']
  push:
    paths: ['dashboard/**', 'extension/js/dashboard-bridge.js', 'extension/manifest.json', '.github/workflows/dashboard-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dashboard-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm audit --prod --audit-level high
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: npm ci --ignore-scripts
        working-directory: extension
      - run: npx playwright install --with-deps chromium
        working-directory: extension
      - run: node scripts/build-browser-fixture.mjs
      - run: node tests/browser-ci.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-browser-evidence
          path: dashboard/test-results/browser
          retention-days: 14
