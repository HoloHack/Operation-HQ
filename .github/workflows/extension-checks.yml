name: Extension quality
on:
  push:
    paths: ['extension/**', '.github/workflows/extension-checks.yml']
  pull_request:
    paths: ['extension/**', '.github/workflows/extension-checks.yml']
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python3 scripts/package-release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-chromium-evidence
          path: extension/test-results
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Operation-HQ-Browser-Companion-3.1.0
          path: extension/release/*.zip
          if-no-files-found: error
          retention-days: 30
