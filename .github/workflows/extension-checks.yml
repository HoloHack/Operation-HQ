name: Operation HQ regression checks
on:
  push:
    paths:
      - 'Operation-HQ 2/**'
      - 'scripts/**'
      - '.github/workflows/extension-checks.yml'
  pull_request:
    paths:
      - 'Operation-HQ 2/**'
      - 'scripts/**'
      - '.github/workflows/extension-checks.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 8 * * 1'
permissions:
  contents: read
concurrency:
  group: hq-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/check-extension.mjs
