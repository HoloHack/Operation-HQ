name: Extension quality
on:
  push:
    paths: ['extension/**', '.github/workflows/extension-checks.yml']
  pull_request:
    paths: ['extension/**', '.github/workflows/extension-checks.yml']
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      # Diagnostic output is not a semantic-quality pass: preserve wrong
      # accepted predictions, coverage and abstentions for review.
      - run: mkdir -p test-results && npm run --silent benchmark:bookmarks > test-results/bookmark-benchmark.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/checkout@v4
        with:
          ref: a9bf15bcfe71c4e5f913887c3678f074cfdc7b83
          path: memory-baseline
          sparse-checkout: extension
      - run: node tests/memory-benchmark.mjs
        env:
          HQ_MEMORY_BASELINE: ${{ github.workspace }}/memory-baseline/extension
      # Same-build diagnostic, not a Mac RAM target or leak certification.
      # Synthetic documents/disposable profiles only; never reset owner Notes.
      - run: node tests/notes-memory.mjs
      - run: python3 scripts/package-release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-chromium-evidence
          path: extension/test-results
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Operation-HQ-Browser-Companion
          path: extension/release/*.zip
          if-no-files-found: error
          retention-days: 30
